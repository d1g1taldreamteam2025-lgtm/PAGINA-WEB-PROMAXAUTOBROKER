# VIGILANTE DE RECUPERACIÓN — cuentas Cloudinary drbc4wbvw (401, jul 2026)
# y kcixfvoq (404, jul 2026): las DOS murieron con material del sitio dentro.
#
# La cuenta murió con banners/flyers/videos dentro y sin respaldo. Las
# suspensiones del plan gratis suelen levantarse SOLAS el día 1 del mes (o si
# el dueño arregla la cuenta). Este workflow prueba a diario: en cuanto los
# archivos respondan 200, los DESCARGA al repo (assets/img/recovered/) y hace
# commit — rescate automático sin que nadie tenga que acordarse.
#
# Cuando haya archivos en assets/img/recovered/: avisar en el chat de Claude
# para re-conectarlos a las páginas (los sitios exactos están anotados en
# CLAUDE.md y en comentarios <!-- --> dentro de index.html, financing, import
# y about). Después de recuperar todo, borrar este workflow.
name: Rescate Cloudinary caídas

on:
  schedule:
    - cron: "17 9 * * *"   # diario 9:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probar y descargar lo que reviva
