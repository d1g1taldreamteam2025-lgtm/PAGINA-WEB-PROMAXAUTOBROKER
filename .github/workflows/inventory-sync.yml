name: Sincronizar inventario (semanal)

# Corre solo cada LUNES a las 10:00 UTC (~6:00 a.m. en Miami en horario de
# verano / 5:00 a.m. en invierno). También se puede lanzar a mano desde la
# pestaña "Actions" con el botón "Run workflow", y se dispara solo cuando se
# actualiza el robot (cualquier push que toque tools/auto-sync/** o este
# workflow) — así el equipo técnico puede correrlo con solo subir un cambio,
# sin tener que entrar a la pestaña Actions.
on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch: {}
  push:
    branches: [claude/pensive-newton-3pumvq]
    paths:
      - "tools/auto-sync/**"
      - ".github/workflows/inventory-sync.yml"

# Evita que dos corridas se pisen
concurrency:
  group: inventory-sync
  cancel-in-progress: false

# contents:write para poder commitear el sitemap-vehicles.xml regenerado (SEO)
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar Playwright + Chromium (+ xvfb para modo con ventana)
        working-directory: tools/auto-sync
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          sudo apt-get install -y xvfb

      - name: Ejecutar la sincronización (navegador con ventana real via xvfb)
        working-directory: tools/auto-sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # Opción A: service_role key (pasa RLS directo)
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Opción B (más fácil): las credenciales de tu panel /admin/
          PROMAX_ADMIN_EMAIL: ${{ secrets.PROMAX_ADMIN_EMAIL }}
          PROMAX_ADMIN_PASSWORD: ${{ secrets.PROMAX_ADMIN_PASSWORD }}
          # Con ventana real (no headless): Cloudflare acepta mucho mejor
          PROMAX_HEADFUL: "1"
          # Fotos: más fichas en paralelo (14) y más presupuesto (45 min) para
          # alcanzar a sacarle las 5 fotos a TODOS los ~3000 carros de HGreg.
          PROMAX_PHOTO_CONC: "14"
          PROMAX_PHOTO_BUDGET_MS: "2700000"
        run: xvfb-run --auto-servernum -- node sync.js

      - name: Commitear el sitemap de vehículos si cambió (SEO)
        run: |
          if [ -n "$(git status --porcelain sitemap-vehicles.xml)" ]; then
            git config user.name "promax-robot"
            git config user.email "robot@promaxautobroker.com"
            git add sitemap-vehicles.xml
            git commit -m "SEO: sitemap de vehiculos actualizado (robot semanal)"
            git push
            echo "Sitemap actualizado y publicado."
          else
            echo "Sitemap sin cambios."
          fi
