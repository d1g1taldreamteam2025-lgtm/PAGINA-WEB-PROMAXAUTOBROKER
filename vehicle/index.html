<style>
.pmx-vd{max-width:var(--maxw);margin:0 auto;padding:30px 24px 70px;}
.pmx-crumb{font-size:13px;color:var(--text-muted);margin-bottom:18px;}
.pmx-crumb a{color:var(--brand);text-decoration:none;}
.pmx-vd__top{display:grid;grid-template-columns:1.3fr 1fr;gap:36px;}
@media(max-width:900px){.pmx-vd__top{grid-template-columns:1fr;gap:24px;}}
.pmx-vd__main{border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);background:#fff;}
.pmx-vd__hero{height:380px;background-size:cover;background-position:center;background-color:#e8edf2;}
@media(max-width:600px){.pmx-vd__hero{height:240px;}}
.pmx-vd__thumbs{display:flex;gap:8px;padding:12px;flex-wrap:wrap;}
.pmx-vd__thumb{width:84px;height:60px;border-radius:6px;background-size:cover;background-position:center;cursor:pointer;border:2px solid transparent;}
.pmx-vd__thumb.active{border-color:var(--brand);}
.pmx-vd__panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:28px;height:fit-content;position:sticky;top:calc(var(--header-h) + 16px);}
.pmx-vd__badge{display:inline-block;background:var(--brand-soft);color:var(--brand-dark);font-weight:800;font-size:11px;letter-spacing:1px;padding:5px 11px;border-radius:5px;text-transform:uppercase;margin-bottom:12px;}
.pmx-vd__panel h1{font-size:28px;margin:0 0 6px;}
.pmx-vd__stock{color:var(--text-muted);font-size:13px;margin-bottom:16px;}
.pmx-vd__price{font-family:var(--font-head);font-size:38px;font-weight:800;color:var(--ink);line-height:1;margin-bottom:4px;}
.pmx-vd__msrp{color:var(--text-faint);text-decoration:line-through;font-size:15px;margin-bottom:18px;}
.pmx-vd__cta{display:flex;flex-direction:column;gap:10px;margin:18px 0;}
.pmx-vd__keyspecs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;padding-top:18px;border-top:1px dashed var(--line);}
.pmx-vd__ks{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text-muted);}
.pmx-vd__ks .material-icons-outlined{color:var(--brand);font-size:18px;}
.pmx-vd__sections{margin-top:48px;display:grid;grid-template-columns:1fr 1fr;gap:40px;}
@media(max-width:780px){.pmx-vd__sections{grid-template-columns:1fr;gap:28px;}}
.pmx-vd__sections h2{font-size:22px;margin:0 0 16px;}
.pmx-spectable{width:100%;border-collapse:collapse;}
.pmx-spectable td{padding:11px 0;border-bottom:1px solid var(--line-soft);font-size:14px;}
.pmx-spectable td:first-child{color:var(--text-muted);}
.pmx-spectable td:last-child{text-align:right;font-weight:600;}
.pmx-featlist{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.pmx-featlist li{display:flex;align-items:center;gap:8px;font-size:14px;}
.pmx-featlist li::before{content:'✓';color:var(--brand);font-weight:800;}
.pmx-vd__desc{grid-column:1/-1;}
.pmx-vd__desc p{color:#37475a;line-height:1.75;}
.pmx-vd__missing{text-align:center;padding:90px 20px;}
</style>
</head>
<body>

<div class="pmx-vd" id="pmxVD">
  <p style="text-align:center;color:#888;padding:60px 0" data-i18n="loading">Cargando vehículo...</p>
</div>

<script src="/assets/js/config.js"></script>
<script src="/assets/js/site.js"></script>
<script src="/assets/js/data.js"></script>
<script>
PMX.addTranslations({
  es:{ loading:"Cargando vehículo...", vd_back:"Inventario", vd_prequal:"Pre-Calificar este vehículo",
    vd_contact:"Preguntar por este auto", vd_specs:"Especificaciones", vd_features:"Equipamiento", vd_desc:"Descripción",
    vd_year:"Año", vd_make:"Marca", vd_model:"Modelo", vd_trim:"Versión", vd_body:"Carrocería", vd_miles:"Millaje",
    vd_fuel:"Combustible", vd_trans:"Transmisión", vd_drive:"Tracción", vd_ext:"Color exterior", vd_int:"Color interior",
    vd_vin:"VIN", vd_stock:"Stock", vd_missing_t:"Vehículo no encontrado", vd_missing_s:"Es posible que ya se haya vendido.",
    vd_see_all:"Ver todo el inventario", vd_similar:"Vehículos similares" },
  en:{ loading:"Loading vehicle...", vd_back:"Inventory", vd_prequal:"Pre-Qualify for this vehicle",
    vd_contact:"Ask about this car", vd_specs:"Specifications", vd_features:"Features", vd_desc:"Description",
    vd_year:"Year", vd_make:"Make", vd_model:"Model", vd_trim:"Trim", vd_body:"Body", vd_miles:"Mileage",
    vd_fuel:"Fuel", vd_trans:"Transmission", vd_drive:"Drivetrain", vd_ext:"Exterior color", vd_int:"Interior color",
    vd_vin:"VIN", vd_stock:"Stock", vd_missing_t:"Vehicle not found", vd_missing_s:"It may have already been sold.",
    vd_see_all:"View all inventory", vd_similar:"Similar vehicles" }
});

(function(){
  var id = new URLSearchParams(location.search).get("id");
  var wa = (PROMAX.contact && PROMAX.contact.whatsapp) || "";
  function row(lbl,val){ return val ? '<tr><td>'+PMX.t(lbl)+'</td><td>'+val+'</td></tr>' : ''; }
  function render(c, all){
    var gallery = c.gallery && c.gallery.length ? c.gallery : [c.image];
    var waMsg = encodeURIComponent((PMX.lang()==="en"?"Hi, I'm interested in the ":"Hola, me interesa el ")+c.year+" "+c.make+" "+c.model+" (Stock "+(c.stock||c.id)+")");
    var waUrl = "https://wa.me/"+wa+"?text="+waMsg;
    var save = c.msrp && c.msrp>c.price ? c.msrp-c.price : 0;
    var similar = all.filter(function(x){return x.id!==c.id && x.bodyType===c.bodyType;}).slice(0,3);
    if(similar.length<3) similar = all.filter(function(x){return x.id!==c.id;}).slice(0,3);

    document.getElementById("pmxVD").innerHTML =
      '<div class="pmx-crumb"><a href="/inventory/">'+PMX.t("vd_back")+'</a> / '+c.year+' '+c.make+' '+c.model+'</div>'+
      '<div class="pmx-vd__top">'+
        '<div>'+
          '<div class="pmx-vd__main">'+
            '<div class="pmx-vd__hero" id="pmxHero" style="background-image:url(\''+gallery[0]+'\')"></div>'+
            (gallery.length>1?'<div class="pmx-vd__thumbs">'+gallery.map(function(g,i){return '<div class="pmx-vd__thumb '+(i===0?'active':'')+'" data-img="'+g+'" style="background-image:url(\''+g+'\')"></div>';}).join("")+'</div>':'')+
          '</div>'+
        '</div>'+
        '<div class="pmx-vd__panel">'+
          (c.badge?'<span class="pmx-vd__badge">'+c.badge+'</span>':'')+
          '<h1>'+c.year+' '+c.make+' '+c.model+'</h1>'+
          '<div class="pmx-vd__stock">'+(c.trim?c.trim+' • ':'')+PMX.t("vd_stock")+' '+(c.stock||c.id)+'</div>'+
          '<div class="pmx-vd__price">'+PMX.money(c.price)+'</div>'+
          (save?'<div class="pmx-vd__msrp">'+PMX.money(c.msrp)+'</div>':'')+
          '<div class="pmx-vd__cta">'+
            '<a href="/financing/apply/?vin='+c.id+'" class="pmx-btn pmx-btn--primary pmx-btn--block">'+PMX.t("vd_prequal")+'</a>'+
            '<a href="'+waUrl+'" target="_blank" rel="noopener" class="pmx-btn pmx-btn--ghost pmx-btn--block">'+PMX.t("vd_contact")+'</a>'+
          '</div>'+
          '<div class="pmx-vd__keyspecs">'+
            '<span class="pmx-vd__ks"><span class="material-icons-outlined">speed</span>'+PMX.num(c.mileage)+' mi</span>'+
            '<span class="pmx-vd__ks"><span class="material-icons-outlined">local_gas_station</span>'+c.fuel+'</span>'+
            '<span class="pmx-vd__ks"><span class="material-icons-outlined">settings</span>'+c.transmission+'</span>'+
            '<span class="pmx-vd__ks"><span class="material-icons-outlined">trending_up</span>'+c.drivetrain+'</span>'+
          '</div>'+
        '</div>'+
      '</div>'+
      '<div class="pmx-vd__sections">'+
        '<div><h2>'+PMX.t("vd_specs")+'</h2><table class="pmx-spectable">'+
          row("vd_year",c.year)+row("vd_make",c.make)+row("vd_model",c.model)+row("vd_trim",c.trim)+
          row("vd_body",c.bodyType.toUpperCase())+row("vd_miles",PMX.num(c.mileage)+" mi")+row("vd_fuel",c.fuel)+
          row("vd_trans",c.transmission)+row("vd_drive",c.drivetrain)+row("vd_ext",c.exteriorColor)+row("vd_int",c.interiorColor)+row("vd_vin",c.vin)+
        '</table></div>'+
        '<div>'+(c.features.length?'<h2>'+PMX.t("vd_features")+'</h2><ul class="pmx-featlist">'+c.features.map(function(f){return '<li>'+f+'</li>';}).join("")+'</ul>':'')+'</div>'+
        (c.description?'<div class="pmx-vd__desc"><h2>'+PMX.t("vd_desc")+'</h2><p>'+c.description+'</p></div>':'')+
      '</div>'+
      (similar.length?'<div style="margin-top:56px"><h2 style="font-size:24px;margin-bottom:20px">'+PMX.t("vd_similar")+'</h2><div class="pmx-vgrid">'+similar.map(simCard).join("")+'</div></div>':'');

    document.querySelectorAll(".pmx-vd__thumb").forEach(function(t){
      t.addEventListener("click",function(){
        document.getElementById("pmxHero").style.backgroundImage="url('"+t.dataset.img+"')";
        document.querySelectorAll(".pmx-vd__thumb").forEach(function(x){x.classList.remove("active");});
        t.classList.add("active");
      });
    });
  }
  function simCard(c){
    return '<article class="pmx-vcard"><a href="/vehicle/?id='+c.id+'" style="text-decoration:none;color:inherit;display:contents">'+
      '<div class="pmx-vcard__img" style="background-image:url(\''+c.image+'\')"></div></a>'+
      '<div class="pmx-vcard__body"><h3 class="pmx-vcard__title">'+c.year+' '+c.make+' '+c.model+'</h3>'+
      '<div class="pmx-vcard__price">'+PMX.money(c.price)+'</div>'+
      '<a href="/vehicle/?id='+c.id+'" class="pmx-btn pmx-btn--primary" style="margin-top:auto">'+PMX.t("btn_details")+'</a></div></article>';
  }
  PMX.addTranslations({es:{btn_details:"Ver Detalles"},en:{btn_details:"View Details"}});

  PMX.loadInventory().then(function(cars){
    var c = cars.filter(function(x){return String(x.id)===String(id);})[0];
    if(!c){
      document.getElementById("pmxVD").innerHTML='<div class="pmx-vd__missing"><h2>'+PMX.t("vd_missing_t")+'</h2><p style="color:#888;margin:8px 0 22px">'+PMX.t("vd_missing_s")+'</p><a href="/inventory/" class="pmx-btn pmx-btn--primary">'+PMX.t("vd_see_all")+'</a></div>';
      return;
    }
    document.title = c.year+" "+c.make+" "+c.model+" | Promax Auto Broker";
    render(c, cars);
    PMX.apply();
  });
})();
</script>
</body>
</html>
