<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Promax Auto Broker — Sitio temporalmente no disponible</title>
<!-- Página de suspensión: 100% autocontenida (sin CSS, imágenes ni scripts
     externos) porque el rewrite de vercel.json manda TODAS las rutas aquí,
     incluidas las de /assets/. Para volver a publicar el sitio, basta con
     quitar el bloque "rewrites" de vercel.json. -->
<style>
  :root{--gold:#f4dc34;--bg:#0c0c0c;--txt:#eaeaea;--mut:#9a9a9a;--line:#262626}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--txt);
    font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:24px}
  .box{max-width:560px;width:100%;text-align:center;border:1px solid var(--line);
    border-radius:16px;padding:44px 32px;background:#131313}
  .logo{font-weight:900;font-size:34px;letter-spacing:1px;font-style:italic;line-height:1}
  .logo b{color:var(--gold)} .logo small{display:block;font-size:13px;letter-spacing:4px;
    font-weight:600;font-style:normal;color:var(--mut);margin-top:6px}
  hr{border:0;border-top:1px solid var(--line);margin:28px 0}
  h1{font-size:21px;margin:0 0 10px} p{margin:0 0 6px;color:var(--mut)}
  .en{margin-top:22px;font-size:14px}
  .tel{margin-top:22px;font-size:15px;color:var(--txt)}
  .tel a{color:var(--gold);text-decoration:none;font-weight:700}
</style>
</head>
<body>
  <div class="box">
    <div class="logo"><b>PRO</b>MAX<small>AUTO BROKER</small></div>
    <hr>
    <h1>Sitio temporalmente no disponible</h1>
    <p>Estamos realizando tareas de mantenimiento.<br>Volveremos a estar en línea pronto.</p>
    <div class="en">
      <p><strong style="color:var(--txt)">Website temporarily unavailable.</strong><br>
      We are performing maintenance and will be back online soon.</p>
    </div>
    <div class="tel">Contacto / Contact: <a href="tel:+13056761259">(305) 676-1259</a></div>
  </div>
</body>
</html>
